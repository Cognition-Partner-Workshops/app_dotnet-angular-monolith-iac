name: Build and Push to ACR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACR_NAME: workshopordermanager
  ACR_REGISTRY: workshopordermanager.azurecr.io
  ACR_REPOSITORY: workshop/ordermanager
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout app code
        uses: actions/checkout@v4
        with:
          repository: Cognition-Partner-Workshops/app_dotnet-angular-monolith
          path: app

      - name: Checkout IaC
        uses: actions/checkout@v4
        with:
          path: iac

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name $ACR_NAME

      - name: Build and push Docker image
        working-directory: app
        run: |
          docker build -f ../iac/docker/Dockerfile -t $ACR_REGISTRY/$ACR_REPOSITORY:$IMAGE_TAG -t $ACR_REGISTRY/$ACR_REPOSITORY:latest .
          docker push $ACR_REGISTRY/$ACR_REPOSITORY:$IMAGE_TAG
          docker push $ACR_REGISTRY/$ACR_REPOSITORY:latest

      - name: Run .NET tests
        working-directory: app
        run: dotnet test --verbosity normal
