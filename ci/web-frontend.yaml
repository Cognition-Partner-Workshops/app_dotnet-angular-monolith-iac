name: Build and Push Web Frontend

on:
  push:
    branches: [main]
    paths:
      - 'src/WebFrontend/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/WebFrontend/**'

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 599083837640.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: workshop/web-frontend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout app code
        uses: actions/checkout@v4
        with:
          repository: Cognition-Partner-Workshops/app_dotnet-angular-microservices
          path: app

      - name: Checkout IaC
        uses: actions/checkout@v4
        with:
          path: iac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::599083837640:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: app/src/WebFrontend
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Run npm tests
        working-directory: app/src/WebFrontend
        run: npm test || true
