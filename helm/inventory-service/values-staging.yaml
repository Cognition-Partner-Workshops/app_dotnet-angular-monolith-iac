replicaCount: 2

image:
  tag: staging-latest

ingress:
  hosts:
    - host: inventory-service-staging.workshop.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75

env:
  - name: ASPNETCORE_ENVIRONMENT
    value: Staging
  - name: ConnectionStrings__DefaultConnection
    value: ""  # Set via sealed-secret or external-secrets operator
  - name: PRODUCT_SERVICE_URL
    value: "http://product-service.decomposition-staging.svc.cluster.local"
