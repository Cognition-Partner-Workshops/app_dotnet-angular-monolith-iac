# ─────────────────────────────────────────────────────────────
# Development environment overrides.
# Merges on top of values.yaml via ArgoCD valueFiles ordering.
# Key differences from production:
#   • single replica, no autoscaling
#   • smaller CPU/memory limits to save cluster resources
#   • ephemeral SQLite (no PVC) — data resets on pod restart
#   • ASPNETCORE_ENVIRONMENT=Development enables detailed errors
# ─────────────────────────────────────────────────────────────

replicaCount: 1

image:
  tag: dev-latest

ingress:
  hosts:
    - host: ordermanager-dev.workshop.local
      paths:
        - path: /
          pathType: Prefix

# Reduced resource allocation for dev workloads
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

env:
  - name: ASPNETCORE_ENVIRONMENT
    value: Development
  - name: ConnectionStrings__DefaultConnection
    value: "Data Source=ordermanager.db"    # ephemeral in-container path (no /data mount)

# No persistent volume in dev — SQLite is ephemeral
persistence:
  enabled: false
