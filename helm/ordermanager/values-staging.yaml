# ─────────────────────────────────────────────────────────────
# Staging environment overrides.
# Merges on top of values.yaml via ArgoCD valueFiles ordering.
# Key differences from dev:
#   • 2–4 replicas with HPA for load-testing readiness
#   • production-sized CPU/memory limits
#   • CPU autoscaling target of 75%
# ─────────────────────────────────────────────────────────────

replicaCount: 2

image:
  tag: staging-latest

ingress:
  hosts:
    - host: ordermanager-staging.workshop.local
      paths:
        - path: /
          pathType: Prefix

# Production-equivalent resource allocation
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Horizontal Pod Autoscaler enabled for staging load tests
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75
