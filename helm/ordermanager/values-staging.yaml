replicaCount: 2

image:
  tag: staging-latest

ingress:
  hosts:
    - host: ordermanager-staging.workshop.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  - name: ASPNETCORE_ENVIRONMENT
    value: Staging
  - name: InventoryService__BaseUrl
    value: "http://inventory-service.decomposition-staging.svc.cluster.local"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75
