# NetworkPolicy — enforces zero-trust networking for OrderManager pods.
# Ingress: only the NGINX ingress controller and (optionally) the
#   Prometheus monitoring namespace can reach the pods.
# Egress: pods can only talk to DNS (port 53) and HTTPS (port 443).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ordermanager.fullname" . }}
  labels:
    {{- include "ordermanager.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ordermanager.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from the NGINX ingress controller namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
    # Allow Prometheus scraping from the monitoring namespace
    {{- if .Values.monitoring.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.monitoring.port }}
    {{- end }}
  egress:
    # DNS resolution (UDP + TCP on port 53)
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Outbound HTTPS (e.g., for external API calls if needed)
    - to: []
      ports:
        - protocol: TCP
          port: 443
