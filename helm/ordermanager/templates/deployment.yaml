# Deployment for the OrderManager monolith container.
# When autoscaling is enabled the HPA controls replica count;
# otherwise the static replicaCount value is used.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ordermanager.fullname" . }}
  labels:
    {{- include "ordermanager.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}   # static count; omitted when HPA manages replicas
  {{- end }}
  selector:
    matchLabels:
      {{- include "ordermanager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ordermanager.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- if .Values.env }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Liveness: restarts the pod if /health stops responding (e.g., deadlock)
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15   # give the app time to start before first check
            periodSeconds: 20
          # Readiness: removes the pod from Service endpoints until /health returns 200
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
