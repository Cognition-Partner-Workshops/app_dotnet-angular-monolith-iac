replicaCount: 2

image:
  repository: 599083837640.dkr.ecr.us-east-1.amazonaws.com/workshop/microservice
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations:
    eks.amazonaws.com/role-arn: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

strategy:
  maxSurge: 1
  maxUnavailable: 0

probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    path: /health/live
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 30

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: ""

config:
  APP_ENV: production
  LOG_LEVEL: info
  PORT: "8080"

monitoring:
  enabled: true
  path: /metrics

networkPolicy:
  additionalIngress: []
  additionalEgress: []
