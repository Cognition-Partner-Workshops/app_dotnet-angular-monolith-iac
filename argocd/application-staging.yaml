apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ordermanager-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Cognition-Partner-Workshops/ordermanager-iac.git
    targetRevision: main
    path: helm/ordermanager
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: decomposition-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
